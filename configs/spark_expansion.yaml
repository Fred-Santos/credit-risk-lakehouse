# Perfil da entrega atual: 17 fontes, driver de 8 GiB.
# Selecionado explicitamente pelos comandos de expansão; ver README.
spark:
  master: local[2]
  app_name: credit-risk-expansion
  config:
    spark.driver.memory: 8g
    spark.driver.maxResultSize: 256m
    spark.sql.shuffle.partitions: '4'
    spark.default.parallelism: '2'
    spark.sql.session.timeZone: UTC
    spark.sql.files.maxPartitionBytes: '67108864'
    spark.ui.enabled: 'false'
